[project]
name = "aletheia"
version = "0.1.0"
description = "An agentic RAG system for knowledge retrieval and intelligent workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi==2026.7.22",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.40.0",
    "langchain==1.2.10",
    "langchain-core==1.2.11",
    "langchain-milvus==0.3.3",
    "langchain-mcp-adapters==0.2.1",
    "langchain-qwq==0.3.4",
    "langchain-text-splitters==1.1.0",
    "langgraph==1.0.8",
    "langgraph-checkpoint==4.0.0",
    "langgraph-prebuilt==1.0.7",
    "langgraph-sdk==0.3.5",
    "loguru==0.7.3",
    "mcp==1.26.0",
    "openai==2.20.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pymilvus==2.6.9",
    "rank-bm25==0.2.2",
    "safetensors==0.6.2",
    "torch==2.10.0",
    "transformers==4.57.6",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "tmp*", "output*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
